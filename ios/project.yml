# The Xcode project, generated with XcodeGen (`xcodegen generate` in ios/); PiBolt.xcodeproj is not committed.
name: PiBolt
options:
  bundleIdPrefix: in.opensec.pibolt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Unsigned builds: AltStore, SideStore or Sideloadly sign the IPA on install (ios/README.md).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
packages:
  PiBoltKit:
    path: PiBoltKit
targets:
  PiBolt:
    type: application
    platform: iOS
    sources:
      - path: PiBolt
    dependencies:
      - package: PiBoltKit
        product: PiBoltProtocol
      - package: PiBoltKit
        product: PiBoltMarkdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.opensec.pibolt.ios
        PRODUCT_NAME: PiBolt
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: PiBolt/Info.plist
      properties:
        CFBundleDisplayName: Pi-Bolt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: Pi-Bolt scans the pairing QR code that /remote-control shows on your computer.
        NSLocalNetworkUsageDescription: Pi-Bolt connects to Pi-Bolt on your computer over the local network.
        # Remote control speaks ws:// to LAN and Tailscale addresses; every byte is Noise-encrypted end to end
        # (docs/remote-control.md), so the transport needs no TLS of its own.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: in.opensec.pibolt.ios.pair
            CFBundleURLSchemes:
              - pibolt
  PiBoltTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PiBoltTests
    dependencies:
      - target: PiBolt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.opensec.pibolt.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PiBolt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PiBolt
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  PiBolt:
    build:
      targets:
        PiBolt: all
        PiBoltTests: [test]
    test:
      targets:
        - PiBoltTests
