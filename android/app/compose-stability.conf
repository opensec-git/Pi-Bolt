// Classes the Compose compiler cannot see into (they come from :protocol, kotlinx.serialization and java.io, which are
// not compiled with it), declared stable here so composables that take them skip by equality instead of by identity.
// Each one is an immutable data class with read-only fields (lists and maps it never mutates), or immutable by
// design (File, JsonObject). SessionState stays out on purpose: comparing a whole session on every recomposition
// would cost more than it saves. Check with: ./gradlew :app:compileReleaseKotlin -Ppibolt.composeReports=true
