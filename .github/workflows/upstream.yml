name: upstream

# Once a day, looks for a new Pi release. When there is one Pi-Bolt does not run yet, opens an issue (once per release) with
# its changelog and the files where merging its tag into pi-bolt conflicts, worked out without a checkout (git merge-tree).
# Merging it: scripts/bump-version.sh --pi X.Y.Z and scripts/train-profile.sh on a branch, and a pull request (docs/RELEASING.md).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: A new Pi release
        run: |
          latest=$(gh api repos/earendil-works/pi/releases/latest --jq .tag_name)
          printf '%s' "$latest" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "unexpected tag: $latest"; exit 1; }
          current=$(python3 -c 'import json; print(json.load(open("sources.json"))["pi"]["tag"])')
          echo "Pi $latest upstream; Pi-Bolt runs $current"
          [ "$latest" != "$current" ] || exit 0
          title="Pi ${latest#v} is out"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "already reported"; exit 0
          fi
          git fetch -q https://github.com/earendil-works/pi.git "refs/tags/$latest:refs/tags/$latest"
          conflicts=$(git merge-tree --write-tree --name-only --no-messages HEAD "$latest" | tail -n +2 || true)
          {
            echo "Pi [$latest](https://github.com/earendil-works/pi/releases/tag/$latest) is released; Pi-Bolt runs $current."
            echo
            if [ -n "$conflicts" ]; then
              echo "Merging \`$latest\` into \`pi-bolt\` conflicts in:"
              echo
              printf '%s\n' "$conflicts" | while IFS= read -r file; do printf -- "- \`%s\`\n" "$file"; done
            else
              echo "\`$latest\` merges into \`pi-bolt\` without conflicts."
            fi
            echo
            echo "To follow it: merge the tag, \`scripts/bump-version.sh --pi ${latest#v}\`, \`scripts/train-profile.sh\` on Linux, the tests, then tag \`bolt-v<version>\` (docs/RELEASING.md)."
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue.md
        env:
          GH_TOKEN: ${{ github.token }}
