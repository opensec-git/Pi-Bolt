name: heap-profile

# Records a Pi version's prebuilt heap order on GitHub's Windows runner: scripts\train-heap.ps1 adds heap-functions.txt to the
# training profile (profiles/pi-X.Y.Z, made by scripts/train-profile.sh on Linux) and rewrites the strings' order in its
# bytecode.order. The profile is uploaded as an artifact and pushed to the branch heap-profile/pi-X.Y.Z, for a pull request
# opened by hand (one opened with this workflow's token would not run ci).
#
# The runtime is the latest release's, and only when it is the engine this commit builds (scripts/runtime-stamp.sh): the order
# names where the build puts each function, which the engine decides.
#
# Run it from the branch with the new profile:
#   gh workflow run heap-profile.yml -R opensec-git/Pi-Bolt --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heap-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Pi version and runtime
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      pi: ${{ steps.check.outputs.pi }}
      runtime_from: ${{ steps.check.outputs.runtime_from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          pi=$(python3 -c 'import json; print(json.load(open("packages/coding-agent/package.json"))["version"])')
          test -f "profiles/pi-$pi/bytecode.order" || { echo "no training profile for Pi $pi (scripts/train-profile.sh)"; exit 1; }
          stamp=$(scripts/runtime-stamp.sh)
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          mkdir -p .work/latest
          gh release download "$latest" --repo "$GITHUB_REPOSITORY" --dir .work/latest \
            --pattern SHA256SUMS --pattern SHA256SUMS.sig --pattern RUNTIME_STAMP
          # The release's stamp counts only as its signed checksums give it, as in the release workflow.
          openssl pkeyutl -verify -pubin -inkey keys/release.pub -rawin -in .work/latest/SHA256SUMS -sigfile .work/latest/SHA256SUMS.sig
          [ "$(head -n 1 .work/latest/SHA256SUMS)" = "# pi-bolt ${latest#bolt-v}" ] || { echo "the checksums are not $latest's"; exit 1; }
          (cd .work/latest && grep ' RUNTIME_STAMP$' SHA256SUMS | sha256sum -c --strict --quiet -)
          released=$(cat .work/latest/RUNTIME_STAMP)
          if [ "$released" != "$stamp" ]; then
            echo "::error title=Runtime needed::The engine changed since $latest (runtime stamp $released, now $stamp): release this engine first."
            exit 1
          fi
          echo "Pi $pi, with $latest's runtime ($stamp)" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "pi=$pi"; echo "runtime_from=$latest"; } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  train:
    name: Heap order on Windows x64
    needs: runtime
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 180
    defaults:
      run:
        # Windows PowerShell 5.1, which the Windows scripts are written for (as in the release workflow).
        shell: powershell
    env:
      PI: ${{ needs.runtime.outputs.pi }}
      RUNTIME_FROM: ${{ needs.runtime.outputs.runtime_from }}
    steps:
      # (No token kept in .git: the build runs code from dependencies.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tools
        run: |
          # The build's code uses what the building CPU has, as the release's does (AVX2).
          Add-Type -Namespace Check -Name Cpu -MemberDefinition '[DllImport("kernel32.dll")] public static extern bool IsProcessorFeaturePresent(uint feature);'
          if (-not [Check.Cpu]::IsProcessorFeaturePresent(40)) { Write-Host "this runner's CPU has no AVX2"; exit 1 }
          # The scripts run Python 3 as `py -3`.
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) {
            $shim = Join-Path $env:RUNNER_TEMP 'py-shim'
            New-Item -ItemType Directory -Force $shim | Out-Null
            Set-Content -Encoding ascii (Join-Path $shim 'py.cmd') "@if `"%~1`"==`"-3`" (python %2 %3 %4 %5 %6 %7 %8 %9) else (python %*)"
            Add-Content -Encoding utf8 $env:GITHUB_PATH $shim
          }
          python --version
      - name: Runtime
        run: |
          New-Item -ItemType Directory -Force .work\rt, .work\runtime | Out-Null
          # The release's checksums, signed by the release key and saying they are that release's, say what it is.
          gh release download $env:RUNTIME_FROM --repo $env:GITHUB_REPOSITORY --pattern pi-bolt-runtime-win32-x64.zip --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir .work\rt
          $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          & $openssl pkeyutl -verify -pubin -inkey keys\release.pub -rawin -in .work\rt\SHA256SUMS -sigfile .work\rt\SHA256SUMS.sig
          if ($LASTEXITCODE -ne 0) { Write-Host 'the runtime release''s signature does not verify'; exit 1 }
          $lines = Get-Content -LiteralPath .work\rt\SHA256SUMS
          if ($lines[0] -ne "# pi-bolt $($env:RUNTIME_FROM -replace '^bolt-v', '')") { Write-Host "the checksums are not $env:RUNTIME_FROM's"; exit 1 }
          $sum = (Get-FileHash .work\rt\pi-bolt-runtime-win32-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($lines -notcontains "$sum  pi-bolt-runtime-win32-x64.zip") { Write-Host 'the runtime is not the one its release lists'; exit 1 }
          Expand-Archive .work\rt\pi-bolt-runtime-win32-x64.zip -DestinationPath .work\rt -Force
          Copy-Item .work\rt\pi-bolt-runtime-win32-x64\bun.exe .work\runtime\bun.exe
          & .work\runtime\bun.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pi
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # (Offline: the model catalog is the repository's, as in prepare-pi.sh.)
          npm run build:offline
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Heap order
        run: |
          & scripts\train-heap.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-${{ env.PI }}
          path: profiles/pi-${{ env.PI }}
          if-no-files-found: error
          retention-days: 14

  branch:
    name: Branch with the profile
    needs: [runtime, train]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PI: ${{ needs.runtime.outputs.pi }}
    steps:
      # (This job runs nothing of the repository's: it only commits the artifact and pushes.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pi-${{ env.PI }}
          path: profiles/pi-${{ env.PI }}
      - name: Push
        run: |
          branch="heap-profile/pi-$PI"
          git add "profiles/pi-$PI"
          if git diff --cached --quiet; then
            echo "profiles/pi-$PI is unchanged" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Windows heap order for Pi $PI" -m "scripts\\train-heap.ps1 on windows-2025, run $GITHUB_RUN_ID."
          git push --force origin "HEAD:refs/heads/$branch"
          {
            echo "### profiles/pi-$PI on \`$branch\`"
            echo
            echo '```bash'
            echo "gh pr create -R $GITHUB_REPOSITORY --base pi-bolt --head $branch --title \"Windows heap order for Pi $PI\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
