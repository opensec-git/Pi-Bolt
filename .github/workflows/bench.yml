name: bench

# Pi-Bolt against the same Pi on stock Bun, on GitHub's Linux x86-64 and ARM64 runners side by side: startup, one headless
# prompt, an interactive session, and the CPU of streaming long answers (bench/benchmark.py, bench/long_answer.py). The builds
# use the latest release's runtime and this commit's Pi. For comparing the two architectures' compiled code, and a change
# against the release, on machines of the same class. Results are the job summaries and an artifact per runner.
#
#   gh workflow run bench.yml -R opensec-git/Pi-Bolt        (or push a branch bench/<name>)
on:
  workflow_dispatch:
  push:
    branches: ["bench/**"]

permissions:
  contents: read

jobs:
  bench:
    name: Bench on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Builds
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux >/dev/null
          scripts/fetch-runtime.sh
          scripts/prepare-pi.sh
          scripts/build-pi.sh --out out/pi-bolt
          scripts/build-pi.sh --stable --out out/pi-stable
          { echo "### $(uname -m), $(nproc) CPUs: $(grep -m1 -E 'model name|CPU part' /proc/cpuinfo | cut -d: -f2 | xargs)"; out/pi-bolt/pi --version; } >>"$GITHUB_STEP_SUMMARY"
      - name: Startup memory
        run: |
          mkdir -p results
          sudo apt-get install -y -qq strace >/dev/null
          {
          echo "== verbose"; BUN_STATIC_HEAP_VERBOSE=1 out/pi-bolt/pi --version </dev/null 2>&1 | head -60
          echo "== THP: $(cat /sys/kernel/mm/transparent_hugepage/enabled) fault_around: $(cat /sys/kernel/debug/fault_around_bytes 2>/dev/null || echo ?) page: $(getconf PAGESIZE)"
          for b in pi-bolt pi-stable; do
            echo "== $b time -v"; /usr/bin/time -v out/$b/pi --version </dev/null 2>&1 | grep -E "Maximum resident|page faults" || true
            echo "== $b at exit"; python3 bench/diag/exit_smaps.py results/$b.smaps out/$b/pi --version || true
            [ -f results/$b.smaps ] && python3 bench/diag/smaps_top.py results/$b.smaps || true
          done
          for thp in always madvise; do
            echo $thp | sudo tee /sys/kernel/mm/transparent_hugepage/enabled >/dev/null
            echo "== THP $thp"
            for b in pi-bolt pi-stable; do
              for i in 1 2 3; do /usr/bin/time -f "$b maxrss_kb %M" out/$b/pi --version </dev/null 2>&1 >/dev/null | tail -1; done
            done
            python3 bench/benchmark.py --runs 11 --warmup 2 --cpus 1 --scenarios startup,headless,interactive \
              --build pi-bolt=out/pi-bolt/pi --build bun=out/pi-stable/pi --baseline bun | sed -n '/^startup/,$p'
          done
          } 2>&1 | tee results/startup_memory.txt
          { echo '```'; cat results/startup_memory.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ runner.arch }}
          path: results/
          retention-days: 30
