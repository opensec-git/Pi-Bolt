name: bench

# Pi-Bolt against the same Pi on stock Bun, on GitHub's Linux x86-64 and ARM64 runners side by side: startup, one headless
# prompt, an interactive session, and the CPU of streaming long answers (bench/benchmark.py, bench/long_answer.py). The builds
# use the latest release's runtime and this commit's Pi. For comparing the two architectures' compiled code, and a change
# against the release, on machines of the same class. Results are the job summaries and an artifact per runner.
#
#   gh workflow run bench.yml -R opensec-git/Pi-Bolt        (or push a branch bench/<name>)
on:
  workflow_dispatch:
  push:
    branches: ["bench/**"]

permissions:
  contents: read
  actions: read

jobs:
  bench:
    name: Bench on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: "38804393196"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace >/dev/null
          case "$(uname -m)" in x86_64) plat=linux-x64 ;; *) plat=linux-arm64 ;; esac
          scripts/fetch-runtime.sh --version bolt-v0.9.1
          scripts/prepare-pi.sh
          scripts/build-pi.sh --out out/pi-bolt-rel
          scripts/build-pi.sh --stable --out out/pi-stable
          gh run download "$RUNTIME_RUN" --repo "$GITHUB_REPOSITORY" --name "runtime-$plat" --dir .work/rt
          tar -C .work/rt -xzf ".work/rt/pi-bolt-runtime-$plat.tar.gz"
          install -m 755 ".work/rt/pi-bolt-runtime-$plat/bun" .work/runtime/bun
          scripts/build-pi.sh --out out/pi-bolt-fix
          for b in pi-bolt-rel pi-bolt-fix; do out/$b/pi --version; done
      - name: Memory with THP always
        run: |
          mkdir -p results
          {
          echo always | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
          for b in pi-bolt-rel pi-bolt-fix pi-stable; do
            for i in 1 2 3 4 5; do /usr/bin/time -f "$b maxrss_kb %M" out/$b/pi --version </dev/null 2>&1 >/dev/null | tail -1; done
            python3 bench/diag/exit_smaps.py results/$b.smaps out/$b/pi --version && python3 bench/diag/smaps_top.py results/$b.smaps | head -4
          done
          python3 bench/benchmark.py --runs 11 --warmup 2 --cpus 1 --scenarios startup,headless,interactive \
            --build rel=out/pi-bolt-rel/pi --build fix=out/pi-bolt-fix/pi --build bun=out/pi-stable/pi --baseline rel | grep -vE 'round [0-9]+/'
          python3 bench/long_answer.py --sizes 20000 --cpus 1 --build rel=out/pi-bolt-rel/pi --build fix=out/pi-bolt-fix/pi
          } 2>&1 | tee results/thp.txt
          { echo '```'; cat results/thp.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ runner.arch }}
          path: results/
          retention-days: 30
