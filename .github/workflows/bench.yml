name: bench

# Pi-Bolt against the same Pi on stock Bun, on GitHub's Linux x86-64 and ARM64 runners side by side: startup, one headless
# prompt, an interactive session, and the CPU of streaming long answers (bench/benchmark.py, bench/long_answer.py). The builds
# use the latest release's runtime and this commit's Pi. For comparing the two architectures' compiled code, and a change
# against the release, on machines of the same class. Results are the job summaries and an artifact per runner.
#
#   gh workflow run bench.yml -R opensec-git/Pi-Bolt        (or push a branch bench/<name>)
on:
  workflow_dispatch:
  push:
    branches: ["bench/**"]

permissions:
  contents: read
  actions: read

jobs:
  bench:
    name: Bench on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in x86_64) plat=linux-x64 ;; *) plat=linux-arm64 ;; esac
          old=bolt-v0.8.5; [ "$plat" = linux-arm64 ] && old=bolt-v0.8.8
          for pair in "old:$old" "rel:bolt-v0.9.1" "new:bolt-v0.9.2"; do
            name=${pair%%:*}; tag=${pair#*:}
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "pi-bolt-$plat.tar.xz" --dir ".work/$name"
            mkdir -p "out/$name" && tar -C "out/$name" --strip-components=1 -xJf ".work/$name/pi-bolt-$plat.tar.xz"
            "out/$name/pi" --version </dev/null
          done
      - name: Suites
        run: |
          mkdir -p results
          for order in "old rel new" "new rel old"; do
            args=(); for b in $order; do args+=(--build "$b=out/$b/pi"); done
            python3 bench/benchmark.py --runs 21 --warmup 3 --cpus 1 "${args[@]}" --baseline old 2>&1 | grep -vE 'round [0-9]+/' | tee -a results/all.txt
          done
          { echo '```'; cat results/all.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ runner.arch }}
          path: results/
          retention-days: 30
