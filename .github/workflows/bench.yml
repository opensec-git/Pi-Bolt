name: bench

# Pi-Bolt against the same Pi on stock Bun, on GitHub's Linux x86-64 and ARM64 runners side by side: startup, one headless
# prompt, an interactive session, and the CPU of streaming long answers (bench/benchmark.py, bench/long_answer.py). The builds
# use the latest release's runtime and this commit's Pi. For comparing the two architectures' compiled code, and a change
# against the release, on machines of the same class. Results are the job summaries and an artifact per runner.
#
#   gh workflow run bench.yml -R opensec-git/Pi-Bolt        (or push a branch bench/<name>)
on:
  workflow_dispatch:
  push:
    branches: ["bench/**"]

permissions:
  contents: read
  actions: read

jobs:
  bench:
    name: Bench on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: "38823518186"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux >/dev/null
          case "$(uname -m)" in x86_64) plat=linux-x64 ;; *) plat=linux-arm64 ;; esac
          scripts/fetch-runtime.sh --version bolt-v0.9.2
          scripts/prepare-pi.sh
          scripts/build-pi.sh --stable --out out/pi-stable
          old=bolt-v0.8.5; [ "$plat" = linux-arm64 ] && old=bolt-v0.8.8
          gh release download "$old" --repo "$GITHUB_REPOSITORY" --pattern "pi-bolt-$plat.tar.xz" --dir .work/old
          mkdir -p out/old && tar -C out/old --strip-components=1 -xJf ".work/old/pi-bolt-$plat.tar.xz"
          gh release download bolt-v0.9.2 --repo "$GITHUB_REPOSITORY" --pattern "pi-bolt-$plat.tar.xz" --dir .work/cand
          mkdir -p out/cand && tar -C out/cand --strip-components=1 -xJf ".work/cand/pi-bolt-$plat.tar.xz"
          # Vanilla Pi 1.2.0 as released on npm, on the official Node 22 and Node 24 binaries.
          npm install --prefix .work/vanilla --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.2.0 >/dev/null
          narch=x64; [ "$plat" = linux-arm64 ] && narch=arm64
          for v in 22 24; do
            base="https://nodejs.org/dist/latest-v$v.x"
            file=$(curl -fsSL "$base/SHASUMS256.txt" | awk -v f="linux-$narch.tar.xz" '$2 ~ f"$" {print $2}')
            curl -fsSL -o ".work/$file" "$base/$file"
            (cd .work && curl -fsSL "$base/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -)
            mkdir -p ".work/node$v" && tar -C ".work/node$v" --strip-components=1 -xJf ".work/$file"
          done
          for b in old cand; do out/$b/pi --version </dev/null; done
          for v in 22 24; do echo "node$v $(.work/node$v/bin/node --version)"; .work/node$v/bin/node .work/vanilla/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js --version </dev/null; done
          echo "THP: $(cat /sys/kernel/mm/transparent_hugepage/enabled)" >>"$GITHUB_STEP_SUMMARY"
      - name: Suites
        run: |
          mkdir -p results
          B=(--build old=out/old/pi --build cand=out/cand/pi --build bun=out/pi-stable/pi --build "node22=.work/node22/bin/node .work/vanilla/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js" --build "node24=.work/node24/bin/node .work/vanilla/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js")
          run() { name=$1; shift; echo "## $name" | tee -a results/all.txt; "$@" 2>&1 | grep -vE 'round [0-9]+/' | tee -a results/all.txt || echo "$name failed" | tee -a results/all.txt; }
          run benchmark python3 bench/benchmark.py --runs 11 --warmup 2 --cpus 1 "${B[@]}" --baseline old
          run long_answer python3 bench/long_answer.py --sizes 20000,60000 --cpus 1 "${B[@]}"
          run tmux_load python3 bench/tmux_load.py --steps md:20000,write:50 --cpus 1 "${B[@]}"
          run pauses python3 bench/pauses.py --cpus 1 "${B[@]}"
          run idle python3 bench/idle.py --seconds 20 --rounds 2 "${B[@]}"
          run long_session python3 bench/long_session.py --prompts 40 --every 20 --cpus 1 "${B[@]}"
          { echo '```'; cat results/all.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ runner.arch }}
          path: results/
          retention-days: 30
