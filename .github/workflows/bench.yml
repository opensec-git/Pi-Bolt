name: bench

# Pi-Bolt against the same Pi on stock Bun, on GitHub's Linux x86-64 and ARM64 runners side by side: startup, one headless
# prompt, an interactive session, and the CPU of streaming long answers (bench/benchmark.py, bench/long_answer.py). The builds
# use the latest release's runtime and this commit's Pi. For comparing the two architectures' compiled code, and a change
# against the release, on machines of the same class. Results are the job summaries and an artifact per runner.
#
#   gh workflow run bench.yml -R opensec-git/Pi-Bolt        (or push a branch bench/<name>)
on:
  workflow_dispatch:
  push:
    branches: ["bench/**"]

permissions:
  contents: read
  actions: read

jobs:
  bench:
    name: Bench on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: "38823518186"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux >/dev/null
          case "$(uname -m)" in x86_64) plat=linux-x64 ;; *) plat=linux-arm64 ;; esac
          gh run download "$RUNTIME_RUN" --repo "$GITHUB_REPOSITORY" --name "runtime-$plat" --dir .work/rt
          tar -C .work/rt -xzf ".work/rt/pi-bolt-runtime-$plat.tar.gz"
          mkdir -p .work/runtime && install -m 755 ".work/rt/pi-bolt-runtime-$plat/bun" .work/runtime/bun
          scripts/prepare-pi.sh
          scripts/build-pi.sh --out out/cand
          scripts/build-pi.sh --stable --out out/pi-stable
          gh release download bolt-v0.9.1 --repo "$GITHUB_REPOSITORY" --pattern "pi-bolt-$plat.tar.xz" --dir .work/rel
          mkdir -p out/rel && tar -C out/rel --strip-components=1 -xJf ".work/rel/pi-bolt-$plat.tar.xz"
          for b in rel cand; do out/$b/pi --version </dev/null; done
          echo "THP: $(cat /sys/kernel/mm/transparent_hugepage/enabled)" >>"$GITHUB_STEP_SUMMARY"
      - name: Suites
        run: |
          mkdir -p results
          B="--build rel=out/rel/pi --build cand=out/cand/pi --build bun=out/pi-stable/pi"
          run() { name=$1; shift; echo "## $name" | tee -a results/all.txt; "$@" 2>&1 | grep -vE 'round [0-9]+/' | tee -a results/all.txt || echo "$name failed" | tee -a results/all.txt; }
          run benchmark python3 bench/benchmark.py --runs 11 --warmup 2 --cpus 1 $B --baseline rel
          run long_answer python3 bench/long_answer.py --sizes 20000,60000 --cpus 1 $B
          run tmux_load python3 bench/tmux_load.py --steps md:20000,write:50 --cpus 1 $B
          run pauses python3 bench/pauses.py --cpus 1 $B
          run idle python3 bench/idle.py --seconds 20 --rounds 2 $B
          run long_session python3 bench/long_session.py --prompts 40 --every 20 --cpus 1 $B
          { echo '```'; cat results/all.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ runner.arch }}
          path: results/
          retention-days: 30
